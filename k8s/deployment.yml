apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-deployment
  labels:
    app: devops-project-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project-app
  template:
    metadata:
      labels:
        app: devops-project-app
    spec:
      containers:
        - name: devops-project-app
          image: nehaarshad/devops_project_app:latest
          ports:
            - containerPort: 80
          imagePullPolicy: Always
